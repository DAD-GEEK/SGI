name: Integracion Continua (CI) - Gestion Integral SGI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  changes:
    name: Detectar Componentes Modificados
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      crm: ${{ steps.filter.outputs.crm }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Evaluar Filtro de Rutas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            landing:
              - 'src/**'
              - 'public/**'
              - 'package*.json'
              - 'vite.config.ts'
              - 'index.html'
            crm:
              - 'crm/**'
            core:
              - 'sgi-core-service/**'

  validate-landing:
    name: Validar SGI Landing Comercial
    needs: changes
    if: ${{ needs.changes.outputs.landing == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Validar Formato y Linter
        run: npm run lint || echo "No hay lint configurado aun"

      - name: Compilar Frontend (Vite)
        run: npm run build

  validate-crm:
    name: Validar SGI CRM y Portal
    needs: changes
    if: ${{ needs.changes.outputs.crm == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: crm/package-lock.json

      - name: Instalar Dependencias
        run: npm ci
        working-directory: crm

      - name: Validar Formato y Linter
        run: npm run lint || echo "No hay lint configurado aun"
        working-directory: crm

      - name: Compilar Frontend (Vite)
        run: npm run build
        working-directory: crm

  validate-core-service:
    name: Validar SGI Core Service (Spring Boot)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'maven'

      - name: Preparar Esquema PostgreSQL
        run: |
          PGPASSWORD=testpassword psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE SCHEMA IF NOT EXISTS sgi;"

      - name: Otorgar Permisos de Ejecucion al Wrapper de Maven
        run: chmod +x mvnw
        working-directory: sgi-core-service

      - name: Compilar y Ejecutar Pruebas Unitarias (Maven)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=sgi
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: testpassword
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_CREATE_NAMESPACES: true
        run: ./mvnw clean test
        working-directory: sgi-core-service

  ci-gate:
    name: 🛡️ Compuerta de Calidad CI (Status Check Obligatorio)
    needs: [changes, validate-landing, validate-crm, validate-core-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Validar Resultados de Validaciones
        run: |
          echo "Evaluando resultados de las validaciones..."
          results="${{ join(needs.*.result, ' ') }}"
          echo "Resultados: $results"
          if [[ "$results" =~ "failure" ]] || [[ "$results" =~ "cancelled" ]]; then
            echo "❌ Uno o más trabajos de validación fallaron o fueron cancelados."
            exit 1
          fi
          echo "✅ Todas las validaciones ejecutadas terminaron con éxito o fueron omitidas justificadamente."

  dispatch-to-waloyo:
    name: 🚀 Notificar a Waloyo CD (Post-Validación CI)
    needs: [changes, ci-gate]
    if: |
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      needs.ci-gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Webhook Dispatch a WaloyoGroup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WALOYO_DISPATCH_TOKEN }}
          repository: DAD-GEEK/WaloyoGroup
          event-type: sgi-deploy
          client-payload: |
            {
              "sgi_core": "${{ needs.changes.outputs.core }}",
              "sgi_crm": "${{ needs.changes.outputs.crm }}",
              "sgi_landing": "${{ needs.changes.outputs.landing }}",
              "actor": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}"
            }



