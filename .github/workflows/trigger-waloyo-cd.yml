name: 📡 Disparar Despliegue en Waloyo Group

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Componente de SGI a desplegar (sgi-all / sgi-core / sgi-crm / sgi-landing)'
        required: false
        default: 'sgi-all'

jobs:
  dispatch-to-waloyo:
    name: 🚀 Notificar a Waloyo CD
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Evaluar Componentes Modificados en SGI
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            landing:
              - 'src/**'
              - 'public/**'
              - 'package*.json'
              - 'vite.config.ts'
              - 'index.html'
            crm:
              - 'crm/**'
            core:
              - 'sgi-core-service/**'

      - name: Enviar Webhook Dispatch a WaloyoGroup
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.WALOYO_DISPATCH_TOKEN }}
          repository: DAD-GEEK/WaloyoGroup
          event-type: sgi-deploy
          client-payload: |
            {
              "sgi_core": "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'sgi-all' || github.event.inputs.target == 'sgi-core') && 'true' || steps.filter.outputs.core }}",
              "sgi_crm": "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'sgi-all' || github.event.inputs.target == 'sgi-crm') && 'true' || steps.filter.outputs.crm }}",
              "sgi_landing": "${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'sgi-all' || github.event.inputs.target == 'sgi-landing') && 'true' || steps.filter.outputs.landing }}",
              "actor": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}"
            }
