# SGI Core Service Engine - Production Profile (Default)
# Consume única y exclusivamente variables inyectadas por GitHub Secrets / Docker Compose
server:
  port: ${PORT:8084}
  servlet:
    context-path: /

spring:
  application:
    name: sgi-core-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:postgres}?currentSchema=sgi
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_schema: sgi

logging:
  level:
    root: INFO
    com.waloyo.sgi: INFO
    org.hibernate.SQL: ERROR
    # Silenciar excepciones esperadas por desconexión abrupta del cliente en HTTP/SSE (Broken pipe / ClientAbortException)
    org.apache.catalina.connector.CoyoteAdapter: ERROR
    org.apache.coyote.http11.Http11NioProtocol: ERROR
    org.apache.catalina.core.ContainerBase.[Tomcat]: OFF


supabase:
  url: ${SUPABASE_URL:https://bmgfqxribkrhbzqvhsjp.supabase.co}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

sgi:
  sync:
    enabled: ${SGI_SYNC_ENABLED:true}
    # Cron por defecto cada 1 hora (configurable via secreto GitHub SGI_SYNC_CRON a cada 3 horas '0 0 */3 * * *')
    cron: ${SGI_SYNC_CRON:0 0 */1 * * *}
    retry:
      max-attempts: ${SGI_SYNC_MAX_ATTEMPTS:3}
      # Reintentos espaciados en 5 minutos (300,000 milisegundos)
      delay-ms: ${SGI_SYNC_RETRY_DELAY_MS:300000}
  datasource:
    mssql:
      host: ${MSSQL_HOST:server163.tecnoweb.net}
      port: ${MSSQL_PORT:1433}
      user: ${MSSQL_USER}
      password: ${MSSQL_PASSWORD}
      db-agenda: ${MSSQL_DB_AGENDA:gestioni_datosNet}
      db-consultor: ${MSSQL_DB_CONSULTOR:gestioni_consultorNet}
      trust-server-certificate: ${MSSQL_TRUST_SERVER_CERTIFICATE:true}
      login-timeout-sec: ${MSSQL_LOGIN_TIMEOUT:15}
