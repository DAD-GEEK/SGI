# SGI Core Service Engine - Enterprise Release
server:
  port: ${PORT:8084}
  servlet:
    context-path: /

spring:
  application:
    name: sgi-core-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/waloyodb?currentSchema=sgi}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: sgi

logging:
  level:
    root: INFO
    com.waloyo.sgi: DEBUG
    org.hibernate.SQL: DEBUG
